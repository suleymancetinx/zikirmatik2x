<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menasik Asistanı (O — I)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg: #0a0e27;
            --panel: rgba(0, 0, 0, 0.7);
            --neon-blue: #00f0ff;
            --neon-green: #00ff64;
            --neon-red: #ff003c;
            --text: #ffffff;
            --case-gradient: linear-gradient(145deg, #16213e, #0f3460);
        }

        .light-mode {
            --bg: #f0f2f5;
            --panel: rgba(255, 255, 255, 0.9);
            --neon-blue: #0056b3;
            --neon-green: #28a745;
            --neon-red: #dc3545;
            --text: #1a1a1a;
            --case-gradient: linear-gradient(145deg, #ffffff, #e6e6e6);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: 0.4s;
        }

        .device-container {
            background: var(--case-gradient);
            width: 350px;
            padding: 30px;
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .mode-toggle {
            position: absolute;
            top: -50px;
            right: 0;
            background: var(--panel);
            border: 1px solid var(--neon-blue);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .digital-screen {
            background: var(--panel);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            margin-bottom: 25px;
            min-height: 270px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .clock-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Merkezlenmiş Kronometre Alanı */
        .chrono-block {
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 15px;
            border: 1px dashed rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chrono-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--neon-green);
            margin-bottom: 8px;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .mini-btn {
            background: none;
            border: 1px solid var(--neon-blue);
            color: var(--text);
            font-size: 10px;
            cursor: pointer;
            border-radius: 5px;
            padding: 5px 12px;
            font-weight: bold;
        }

        /* Sayaçlar */
        .counter-box { text-align: center; }
        .counter-label { font-size: 14px; letter-spacing: 3px; color: var(--neon-blue); font-weight: bold; margin-bottom: 5px; }
        .counter-number { font-family: 'Orbitron', sans-serif; font-size: 50px; margin: 0; }

        .progress-dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; border: 1px solid #555; }
        .dot.active { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); border-color: #fff; }

        /* Ana Basma Tuşu (O) */
        .main-push-btn {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.1);
            background: linear-gradient(135deg, var(--neon-blue), #1e3a8a);
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }

        .main-push-btn::after {
            content: 'O';
            font-family: 'Orbitron', sans-serif;
            font-size: 40px;
            color: white;
            font-weight: 900;
            opacity: 0.8;
        }

        .main-push-btn:active { transform: scale(0.92); box-shadow: 0 0 10px var(--neon-blue); }

        /* Alt Kontroller */
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .reset-btn {
            background: none;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .tabs { display: flex; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 4px; }
        .tab-btn { background: none; border: none; color: #888; padding: 8px 15px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: bold; }
        .tab-btn.active { color: var(--neon-blue); background: rgba(0, 240, 255, 0.1); border-radius: 10px; }

        .hidden { display: none; }
    </style>
</head>
<body>

<button class="mode-toggle" onclick="document.body.classList.toggle('light-mode')">☀️ / 🌙</button>

<div class="device-container">
    <div class="digital-screen">
        <div class="clock-display">🕒 <span id="clock">00:00</span></div>
        
        <div class="chrono-block">
            <span class="chrono-time" id="chrono">00:00:00</span>
            <div class="timer-controls">
                <button class="mini-btn" onclick="startTimer()">BAŞLAT</button>
                <button class="mini-btn" onclick="stopTimer()">DURDUR</button>
                <button class="mini-btn" onclick="resetTimer()" style="color:var(--neon-red); border-color:var(--neon-red);">Sıfırla</button>
            </div>
        </div>

        <div id="menasik-panel">
            <div class="counter-box">
                <div class="counter-label">TAVAF - SA'Y</div>
                <div class="counter-number" id="say-val">0</div>
                <div class="progress-dots" id="dots">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div id="zikir-panel" class="hidden">
            <div class="counter-box">
                <div class="counter-label">TESBİHAT</div>
                <div class="counter-number" id="zikir-val">0</div>
            </div>
        </div>
    </div>

    <button class="main-push-btn" onclick="handleCount()"></button>

    <div class="footer-row">
        <button class="reset-btn" onclick="handleReset()">RESET</button>
        <div class="tabs">
            <button id="btn-say" class="tab-btn active" onclick="switchTab('say')">O — I</button>
            <button id="btn-zikir" class="tab-btn" onclick="switchTab('zikir')">Zikir</button>
        </div>
    </div>
</div>

<script>
    let counts = { say: 0, zikir: 0 };
    let currentTab = 'say';
    let timerInterval;
    let seconds = 0;

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000); updateClock();

    function startTimer() {
        if (timerInterval) return;
        timerInterval = setInterval(() => {
            seconds++;
            let h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            let m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('chrono').innerText = `${h}:${m}:${s}`;
        }, 1000);
    }

    function stopTimer() { clearInterval(timerInterval); timerInterval = null; }
    function resetTimer() { stopTimer(); seconds = 0; document.getElementById('chrono').innerText = "00:00:00"; }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('menasik-panel').classList.toggle('hidden', tab !== 'say');
        document.getElementById('zikir-panel').classList.toggle('hidden', tab !== 'zikir');
        document.getElementById('btn-say').classList.toggle('active', tab === 'say');
        document.getElementById('btn-zikir').classList.toggle('active', tab === 'zikir');
    }

    function handleCount() {
        if (currentTab === 'say') {
            if (counts.say < 7) {
                counts.say++;
                document.getElementById('say-val').innerText = counts.say;
                document.querySelectorAll('.dot')[counts.say - 1].classList.add('active');
            }
        } else {
            counts.zikir++;
            document.getElementById('zikir-val').innerText = counts.zikir;
        }
    }

    function handleReset() {
        if (confirm("Bu sayaç sıfırlansın mı?")) {
            if (currentTab === 'say') {
                counts.say = 0;
                document.getElementById('say-val').innerText = 0;
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            } else {
                counts.zikir = 0;
                document.getElementById('zikir-val').innerText = 0;
            }
        }
    }
</script>

</body>
</html>
